  files:
    - path: ../G474RE_SBUS2RS485/startup_stm32g474xx.s
    - path: ../G474RE_SBUS2RS485/Middlewares/Third_Party/FreeRTOS/Source/croutine.c
    - path: ../G474RE_SBUS2RS485/Middlewares/Third_Party/FreeRTOS/Source/event_groups.c
    - path: ../G474RE_SBUS2RS485/Middlewares/Third_Party/FreeRTOS/Source/list.c
    - path: ../G474RE_SBUS2RS485/Middlewares/Third_Party/FreeRTOS/Source/queue.c
